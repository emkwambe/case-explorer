services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: case_explorer
      POSTGRES_PASSWORD: case_explorer
      POSTGRES_DB: case_explorer
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_explorer"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "scripts/db_migrate.js"]
    environment:
      DATABASE_URL: postgres://case_explorer:case_explorer@postgres:5432/case_explorer
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["node", "scripts/seed.js", "--count", "300", "--seed", "42"]
    environment:
      DATABASE_URL: postgres://case_explorer:case_explorer@postgres:5432/case_explorer
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://case_explorer:case_explorer@postgres:5432/case_explorer
      API_KEYS: ${API_KEYS:-dev-key-1}
      NODE_ENV: production
      CORS_ORIGIN: "*"
    depends_on:
      seed:
        condition: service_completed_successfully

  analytics:
    build:
      context: ./analytics
    profiles: ["analytics"]
    command: ["python", "-m", "case_analytics.pipeline", "--data", "data", "--out", "artifacts"]
    volumes:
      - ./analytics/data:/app/data
      - ./analytics/artifacts:/app/artifacts

volumes:
  pgdata:
