name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Run mutation testing over the decision logic (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit, property and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  script-suites:
    name: Engine checks, locked Findings numbers, test spine and credit tape
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # test:credit, test:dealers, test:funding, test:public-record, test:sandbox, test:locked,
      # test:spine and test:tape, in that order; the first failure fails the job.
      - run: npm run test:all

  benchmark:
    name: Analytical benchmark (release gates and answer keys)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails the job when any mandatory gate in src/evaluation/gates.js fails, or when a pinned case
      # set differs from its answer key in benchmarks/ (or the key is not named in benchmarks/CHANGELOG.md).
      - run: node scripts/benchmark.js --count 2000 --seed 42 --out artifacts
      - name: Verify README metrics are generated from artifacts, not typed
        run: node scripts/update_readme_metrics.js --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-artifacts
          path: artifacts/
          retention-days: 90

  mutation:
    name: Mutation testing (decision logic)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Scoped to the modules where a silently wrong branch is most costly.
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

  python-analytics:
    name: Python analytics (ruff, mypy, pytest, model pipeline)
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]" -c constraints-credit.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Build governed datasets from the generator
        run: node scripts/build_datasets.js --out analytics/data --train 6000 --seed 42
        working-directory: .
      - name: Regenerate the credit-model books and check every SHA-256 against the manifest
        run: |
          node scripts/export_credit_features.mjs
          git diff --exit-code -- data/credit-model
        working-directory: .
      - run: pytest -q
      - name: Rebuild the credit PD snapshot and compare it numerically with the committed one
        run: |
          python -m case_analytics.credit.pipeline --out "$RUNNER_TEMP/credit-model-snapshot"
          python -m case_analytics.credit.compare ../artifacts/credit-model-snapshot "$RUNNER_TEMP/credit-model-snapshot"
          python -m case_analytics.credit.docs --check
      - name: Train, evaluate and validate the model suite
        run: python -m case_analytics.pipeline --data data --out artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-artifacts
          path: analytics/artifacts/
          retention-days: 90

  api-integration:
    name: API integration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: case_explorer
          POSTGRES_PASSWORD: case_explorer
          POSTGRES_DB: case_explorer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U case_explorer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://case_explorer:case_explorer@localhost:5432/case_explorer
      API_KEYS: ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed -- --count 200
      - run: npm run test:integration

  security:
    name: Security (dependency audit, secrets, SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  build:
    name: Build application and container
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: case-explorer-build
          path: dist/
          retention-days: 7
      - name: Build container image
        run: docker build -t case-explorer:ci .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pins setup-trivy by SHA; v0.28.0 referenced a deleted setup-trivy tag)
        with:
          image-ref: case-explorer:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  deploy-pages:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, benchmark, python-analytics, script-suites]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pages serves from /<repo>/, so the demo is built with the matching base path.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # The demo reads real numbers from published artifacts; both sets land in dist/artifacts/.
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-artifacts
          path: dist/artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: dist/artifacts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
